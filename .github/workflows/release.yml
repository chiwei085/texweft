name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-22.04
          - platform: aarch64-linux
            os: ubuntu-22.04-arm
    # The oldest supported runner sets the minimum glibc of the binary (2.35).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: |
          cp target/release/texweft texweft-${{ matrix.platform }}
          sha256sum texweft-${{ matrix.platform }} > texweft-${{ matrix.platform }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: texweft-${{ matrix.platform }}
          path: texweft-${{ matrix.platform }}*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "texweft $GITHUB_REF_NAME" texweft-*
